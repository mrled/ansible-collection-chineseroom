---
- name: Install prereqs
  # Make sure we have the libraries needed for Ansible to be able to install packages
  ansible.builtin.command: dnf install -y python3-libdnf5
  args:
    # The actual Python files include a Python version, e.g. /usr/lib64/python3.14/site-packages/libdnf5/__init__.py
    # This license file is less correct but works with whatever the system's Python version is
    creates: /usr/share/licenses/python3-libdnf5

- name: Create and configure chineseroom user
  ansible.builtin.import_tasks: user.yml
  tags:
    - chineseroom_user

- name: Install system apps
  ansible.builtin.import_tasks: apps-system.yml
  tags:
    - chineseroom_apps_system

- name: Install apps as the restricted user
  ansible.builtin.import_tasks: apps-user.yml
  tags:
    - chineseroom_apps_user

- name: Configure Let's Encrypt
  tags:
    - chineseroom_letsencrypt
  ansible.builtin.import_tasks: letsencrypt.yml
- name: Install and configure Nginx
  ansible.builtin.import_tasks: nginx.yml
  tags:
    - chineseroom_nginx

- name: Set up subdomain:port mappings from the restricted user
  ansible.builtin.import_tasks: usermapping.yml
  tags:
    - chineseroom_usermapping
