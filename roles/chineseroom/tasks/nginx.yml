---
- name: Install required packages
  ansible.builtin.package:
    name:
      - nginx
    state: present

- name: Create nginx trusted conf directory
  ansible.builtin.file:
    path: "{{ chineseroom_nginx_conf_trusted_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create nginx sandbox conf directory
  ansible.builtin.file:
    path: "{{ chineseroom_nginx_conf_sandbox_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy shared SSL/TLS parameters
  ansible.builtin.template:
    src: nginx-ssl.conf.j2
    dest: "{{ chineseroom_nginx_ssl_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Add includes for trusted and sandbox conf directories
  ansible.builtin.copy:
    content: |
      include {{ chineseroom_nginx_conf_trusted_dir }}/*.conf;
      include {{ chineseroom_nginx_conf_sandbox_dir }}/*.conf;
    dest: "{{ chineseroom_nginx_conf_dir }}/chineseroom-includes.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Create nginx configuration for domain
  ansible.builtin.template:
    src: nginx-domain.conf.j2
    dest: "{{ chineseroom_nginx_conf_dir }}/{{ chineseroom_letsencrypt_domain }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Set server_names_hash_bucket_size for long hostnames
  ansible.builtin.copy:
    content: |
      # Long sandbox hostnames (e.g. app.sandbox.host.example.com) exceed
      # nginx's default 64-byte hash bucket size.
      server_names_hash_bucket_size 128;
    dest: "{{ chineseroom_nginx_conf_dir }}/chineseroom-tuning.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Add connection upgrade map to nginx config
  ansible.builtin.copy:
    content: |
      # This is required to enable
      #   proxy_set_header   Connection $connection_upgrade;
      # which is required for WebSocket support
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
    dest: "{{ chineseroom_nginx_conf_dir }}/connection-upgrade.conf"
    owner: root
    group: root
    mode: "0644"

- name: Configure firewall for HTTP and HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - http
    - https
  when: chineseroom_firewall_enabled

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Allow nginx to connect to make outbound network connections
  # This is required for connecting to localhost too
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
