---
# .github/workflows/publish.yml
name: Publish Ansible Collection

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible Core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Verify tag matches galaxy.yml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GALAXY_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          match = re.search(r'^version:\s*(\S+)\s*$', Path('galaxy.yml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('Could not find version in galaxy.yml')
          print(match.group(1))
          PY
          )

          if [ "$TAG_VERSION" != "$GALAXY_VERSION" ]; then
            echo "Tag version v$TAG_VERSION does not match galaxy.yml version $GALAXY_VERSION" >&2
            exit 1
          fi

      - name: Build collection
        run: |
          ansible-galaxy collection build

      - name: Publish to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
        run: |
          FILE=$(ls *.tar.gz | head -n 1)
          ansible-galaxy collection publish "$FILE" --api-key "$ANSIBLE_GALAXY_TOKEN"
